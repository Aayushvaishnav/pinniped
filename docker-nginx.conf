server {
  listen 8080;
  listen [::]:8080;

  # Content-hashed bundles never change under the same name: cache them for good.
  # A missing one is a real 404, not the SPA fallback (which would serve HTML as JS).
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The call widget's own hashed bundles, loaded in the iframe.
  location /public/element-call/assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (index.html, the widget's index.html, sw.js, config.json, ...)
  # keeps its name across deploys. Without a Cache-Control header browsers guess a
  # freshness lifetime from Last-Modified, so a new deploy is not picked up until a
  # hard reload. no-cache means "revalidate every time": a cheap 304 when unchanged.
  location / {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
