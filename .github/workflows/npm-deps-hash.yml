# Fork-only: refresh the fixed-output hashes of the Nix build (npmDepsHash in
# package.nix, the pnpm store hash in element-call.nix) when a lockfile changes
# on fork/dev, verify the Nix build, and open a PR with the fix. The maintainer
# only ever merges the PR; no local Nix tooling needed.
name: npm-deps-hash
on:
  push:
    branches: [fork/dev]
    paths:
      - package-lock.json
      - package.nix
      - element-call.nix
      - element-call/pnpm-lock.yaml
      - flake.nix
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build, refreshing stale hashes
        id: build
        run: |
          set -o pipefail
          # --no-link: no result symlink; log lives outside the checkout so the
          # PR only ever contains the hash changes.
          log="$RUNNER_TEMP/build.log"
          changed=false
          built=false
          # Each stale fixed-output hash fails the build on its own, so fix one per
          # attempt (npm deps, pnpm deps) until the whole build passes.
          for attempt in 1 2 3 4; do
            if nix build .#pinniped --no-link -L 2>&1 | tee "$log"; then
              built=true
              break
            fi
            hash=$(grep -oE "got: +sha256-[A-Za-z0-9+/=]+" "$log" | head -1 | awk '{print $2}')
            drv=$(grep -oE "hash mismatch in fixed-output derivation '[^']+'" "$log" | head -1)
            if [[ -z "$hash" ]]; then
              echo "build failed for a reason other than a stale hash" >&2
              exit 1
            fi
            case "$drv" in
              *pnpm-deps*) ./scripts/update-pnpm-deps.sh "$hash" ;;
              *npm-deps*) ./scripts/update-npm-deps.sh "$hash" ;;
              *)
                echo "unrecognised fixed-output derivation: $drv" >&2
                exit 1
                ;;
            esac
            changed=true
          done
          if [[ "$built" != true ]]; then
            echo "build still failing after refreshing hashes" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.build.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: fork/dev
          branch: auto/npm-deps-hash
          title: 'chore: refresh Nix dependency hashes'
          body: |
            A lockfile changed but the Nix dependency hashes (`npmDepsHash` in
            `package.nix`, the pnpm store hash in `element-call.nix`) were stale.
            Hashes refreshed and `nix build .#pinniped` verified on CI. Merge to keep
            the Nix flake buildable.
          commit-message: 'chore: refresh Nix dependency hashes'
          delete-branch: true
