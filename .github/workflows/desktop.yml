# Fork-only: build the Electron desktop app (AppImage, rpm, flatpak, msi, dmg) on CI.
# Every run uploads the installers as workflow artifacts; pushing a `v*` tag
# also attaches them to a GitHub release.
name: desktop
on:
  push:
    branches: [fork/dev]
    tags: ['v*']
    paths:
      - electron/**
      - element-call/**
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: npm ci
      - name: Build (includes the Element Call fork)
        env:
          APP_COMMIT: ${{ github.sha }}
          NODE_OPTIONS: --max_old_space_size=8192
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  package:
    name: Package (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            flags: --linux AppImage rpm flatpak
            files: |
              electron/out/*.AppImage
              electron/out/*.rpm
              electron/out/*.flatpak
          - name: windows
            os: windows-latest
            flags: --win msi
            files: electron/out/*.msi
          - name: macos
            os: macos-latest
            flags: --mac dmg --x64 --arm64
            files: electron/out/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
        env:
          HUSKY: '0'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Package
        run: npx electron-builder --config electron/electron-builder.yml ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pinniped-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pinniped-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
