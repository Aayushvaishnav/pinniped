# Pods in this namespace must meet the "restricted" Pod Security Standard, so no
# workload here can run privileged, use host namespaces or hostPath, or run as root.
apiVersion: v1
kind: Namespace
metadata:
  name: githubshit
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: githubshit
  labels:
    app: cinny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinny
  template:
    metadata:
      labels:
        app: cinny
    spec:
      # Static site: no Kubernetes API access and no service env vars needed.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cinny
          image: repo.k8s.mreow.de/githubshit/cinny:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            # nginx's pid file and temp paths; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
# Routing is done by HTTPRoutes (cinny.k8s.mreow.de, im.queef.in) in the cluster's
# infrastructure repo, which target this Service on port 80.
apiVersion: v1
kind: Service
metadata:
  name: cinny
  namespace: githubshit
spec:
  type: ClusterIP
  selector:
    app: cinny
  ports:
    - port: 80
      targetPort: http
      name: http
