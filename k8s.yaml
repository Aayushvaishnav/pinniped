# Pods in this namespace must meet the "restricted" Pod Security Standard, so no
# workload here can run privileged, use host namespaces or hostPath, or run as root.
apiVersion: v1
kind: Namespace
metadata:
  name: githubshit
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: githubshit
  labels:
    app: cinny
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinny
  template:
    metadata:
      labels:
        app: cinny
    spec:
      # Static site: no Kubernetes API access and no service env vars needed.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cinny
          image: repo.k8s.mreow.de/githubshit/cinny:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            # nginx's pid file and temp paths; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
# cinny.k8s.mreow.de and im.queef.in are routed by HTTPRoutes in the cluster's
# infrastructure repo. pinniped.stablecat.club is routed from here (below); only its
# HTTPS listener (named pinniped-stablecat-club, TLS from the secret below) lives on the
# shared gateway in that repo. All of them target this Service on port 80.
apiVersion: v1
kind: Service
metadata:
  name: cinny
  namespace: githubshit
spec:
  type: ClusterIP
  selector:
    app: cinny
  ports:
    - port: 80
      targetPort: http
      name: http
---
# TLS for pinniped.stablecat.club, issued over HTTP-01 through the gateway, so the DNS
# record (A 185.255.121.170, AAAA 2a13:5681:1:c47::100) must exist first. The gateway
# listener reads the secret from this namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pinniped-stablecat-club-gw-tls
  namespace: githubshit
spec:
  secretName: pinniped-stablecat-club-gw-tls
  dnsNames:
    - pinniped.stablecat.club
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinniped-stablecat-club
  namespace: githubshit
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: pinniped-stablecat-club
  hostnames:
    - pinniped.stablecat.club
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cinny
          port: 80
---
# Plain HTTP to HTTPS. The shared redirect routes in the infrastructure repo are at the
# 16-hostname limit, and the gateway's http listener accepts routes from any namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinniped-stablecat-club-https-redirect
  namespace: githubshit
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - pinniped.stablecat.club
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
