appId: de.mreow.pinniped
productName: Pinniped
copyright: Pinniped contributors (AGPL-3.0-only)

directories:
  output: electron/out
  buildResources: electron/build

# main process uses only node built-ins + electron, so ship dist + electron/
# and explicitly drop node_modules to keep the package lean
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - electron/app-protocol.cjs
  - electron/menu.cjs
  - electron/rich-presence.cjs
  - electron/build/icon.png
  - package.json
  - '!node_modules/**/*'

extraMetadata:
  main: electron/main.cjs

# unpacked app dir: `just sync` rsyncs a fresh dist into the installed app
# without repacking an asar on every iteration
asar: false

# app ships no node_modules (main uses only node built-ins), skip native rebuild
npmRebuild: false

linux:
  # ties the running window (WM_CLASS / app id) to pinniped.desktop so
  # taskbars show this icon instead of a generic one
  syncDesktopName: true
  target:
    - AppImage
    - deb

rpm:
  # fpm defaults to single-threaded gzip -9 (w9.gzdio): ~65 s for the ~350 MB
  # payload. Multithreaded xz gets the same size class in a fraction of the time.
  fpm:
    - --rpm-compression
    - xzmt
    - --rpm-compression-level
    - '6'
  category: Network
  icon: electron/build/icon.png
  synopsis: Yet another Matrix client
  description: Desktop build of the Pinniped Matrix client.
  maintainer: largelanguagemeowing <noreply@mreow.de>

mac:
  target:
    - dmg
  category: public.app-category.social-networking
  icon: electron/build/icon.png
  # unsigned local build; macOS kills apps that request camera/mic access
  # without these usage strings
  identity: null
  extendInfo:
    NSCameraUsageDescription: Pinniped needs camera access for video calls.
    NSMicrophoneUsageDescription: Pinniped needs microphone access for calls.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
  icon: electron/build/icon.png

nsis:
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
